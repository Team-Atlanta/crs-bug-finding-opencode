##############################################################################
#                        CRS Compose Configuration                           #
#                  Example for crs-bug-finding-opencode                       #
##############################################################################

# --- General Settings -------------------------------------------------------
run_env: local
docker_registry: local

# --- Infrastructure ---------------------------------------------------------
oss_crs_infra:
  cpuset: "0-1"
  memory: "8G"

# --- CRS (crs-bug-finding-opencode) ----------------------------------------
crs-bug-finding-opencode:
  source:
    local_path: /path/to/crs-bug-finding-opencode    # UPDATE: local filesystem path
  cpuset: "2-7"                                       # UPDATE: available CPU cores
  memory: "16G"                                       # UPDATE: available memory
  llm_budget: 10                                      # LLM budget in USD
  additional_env:
    # opencode talks to the OSS-CRS LiteLLM proxy via its custom provider.
    # OPENCODE_MODEL is the model alias as exposed by the proxy
    # (must match a model_name in required_llms / litellm-config.yaml).
    CRS_AGENT: opencode
    OPENCODE_MODEL: claude-sonnet-4-5
    # AGENT_TIMEOUT: "3600"                            # Optional: seconds, 0 = no limit (default)

# --- Optional LLM Configuration --------------------------------------------
# Uncomment if you want OSS-CRS to inject an external LiteLLM endpoint.
# llm_config:
#   litellm:
#     mode: external
#     external:
#       url_env: EXTERNAL_LITELLM_API_BASE
#       key_env: EXTERNAL_LITELLM_API_KEY
